name: Native Android

on:
  pull_request:
    paths:
      - 'native/Android/**'
      - 'scripts/android/**'
      - 'scripts/native/resources/export-catalogs.ts'
      - 'src/services/**'
      - 'assets/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/native-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install shared content tools
        run: bun install --frozen-lockfile
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and check Android
        working-directory: native/Android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --console=plain
      - name: Check unsigned release packaging
        working-directory: native/Android
        env:
          ANDROID_ALLOW_UNSIGNED_RELEASE: 'true'
        run: ./gradlew :app:bundleRelease :app:lintRelease --no-configuration-cache --console=plain
      - name: Install pinned bundletool
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$RUNNER_TEMP/bundletool.jar"
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "bundletool.jar"
          with path.open("rb") as source:
              actual = hashlib.file_digest(source, "sha256").hexdigest()
          expected = "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"
          if actual != expected:
              raise SystemExit("bundletool checksum mismatch")
          PY
      - name: Verify unsigned bundle structure
        run: >-
          python3 scripts/android/release/verify-bundle.py
          native/Android/app/build/outputs/bundle/release/app-release.aab
          --metadata native/Android/app/build/reports/release/release-inputs.properties
          --bundletool "$RUNNER_TEMP/bundletool.jar"
          --allow-unsigned
          --report native/Android/app/build/reports/release/bundle-checks.json
      - name: Verify shared content
        run: python3 scripts/android/verify-assets.py --output native/Android/app/build/generated/john
      - name: Save installable app
        uses: actions/upload-artifact@v4
        with:
          name: john-android-debug
          path: native/Android/app/build/outputs/apk/debug/app-debug.apk
      - name: Save check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: john-android-checks
          path: |
            native/Android/app/build/reports/tests/
            native/Android/app/build/reports/lint-results-debug.html
            native/Android/app/build/reports/lint-results-release.html
            native/Android/app/build/reports/release/
          if-no-files-found: ignore
